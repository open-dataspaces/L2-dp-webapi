name: PR CI - Tests & Build Verification

on: [push, pull_request]

permissions:
  contents: read
  checks: write
  pull-requests: write
  
jobs:
  ci-pipeline:
    name: Run CI pipeline with tests and build verification
    runs-on: ubuntu-latest

    steps:
      # Required: checkout needed for report annotation creation
      # using Git information
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for code analysis

      # Set up JDK for build and testing
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Cache Maven dependencies to avoid re-downloading
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build project and download dependencies (without running tests)
      - name: Build with Maven and cache dependencies
        run: mvn -B clean compile -DskipTests

      # Run tests using official Maven Docker image
      # Note: Use cached dependencies from previous step
      - name: Run Maven tests inside Docker (Temurin JDK 21)
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B -Dmaven.test.failure.ignore=true test

      # Check for test reports (debug)
      - name: Debug - Check test reports
        if: always()
        run: |
          echo "=== Checking test report files ==="
          ls -la target/ || echo "No target directory"
          ls -la target/surefire-reports/ || echo "No surefire-reports dir"
          find . -name "TEST-*.xml" -type f || echo "No TEST-*.xml found"

      # Display JUnit XML with dorny/test-reporter in GitHub Checks / Job Summary
      - name: Publish JUnit test report
        if: always()   # Publish reports even if tests fail
        uses: dorny/test-reporter@v1
        with:
          name: 'JUnit Test Report'
          path: 'target/surefire-reports/TEST-*.xml'
          reporter: 'java-junit'
          fail-on-error: false
          max-annotations: 30   # Balanced limit to avoid size issues while showing sufficient detail

      # Post test results as comments on PR
      - name: Comment Test Results on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Count test files
            const testDir = 'target/surefire-reports';
            let testCount = 0;
            let failedCount = 0;
            
            try {
              const files = fs.readdirSync(testDir);
              testCount = files.filter(f => f.startsWith('TEST-') && f.endsWith('.xml')).length;
              
              // Create simple result summary
              const summary = `## 🧪 Maven Test Results
              
              📊 **Test Summary:**
              - Total test suites: ${testCount}
              - Status: ${testCount > 0 ? '✅ Tests executed' : '❌ No tests found'}
              
              📁 **Artifacts:** Test reports are available for download in the Actions tab
              
              🔍 **Details:** Check the "Checks" tab for detailed test results`;
              
              // Post comment to PR
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              console.log('Error reading test results:', error);
            }

      # Upload HTML reports as artifacts (downloadable)
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results-html
          path: |
            target/surefire-reports/
            target/site/
          retention-days: 30
