openapi: 3.0.3
info:
  title: Prism Mock for /test
  version: 1.3.0
  description: |
    /test endpoint that returns a confirmation message.
    - Body: optional, any JSON or plain text accepted.
    - Headers: none are required.
servers:
  - url: http://localhost:4010
paths:
  /test:
    post:
      summary: Confirm request reception
      description: Returns a confirmation message for any POST request.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Arbitrary JSON payload.
          text/plain:
            schema:
              type: string
              description: Arbitrary text payload.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                success:
                  value: "Request successfully delivered!"
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                success:
                  value:
                    message: "Request successfully delivered!"
  /authtest:
    post:
      summary: Confirm request reception
      description: Returns a confirmation message for any POST request.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Arbitrary JSON payload.
          text/plain:
            schema:
              type: string
              description: Arbitrary text payload.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                success:
                  value: "Request successfully delivered!"
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                success:
                  value:
                    message: "Request successfully delivered!"
  /authngtest:
    post:
      summary: Confirm request reception
      description: Returns a confirmation message for any POST request.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Arbitrary JSON payload.
          text/plain:
            schema:
              type: string
              description: Arbitrary text payload.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
              examples:
                success:
                  value: "This is the endpoint for authorization errors!"
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                success:
                  value:
                    message: "This is the endpoint for authorization errors!"
